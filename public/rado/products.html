<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products — Rado Social Hub</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/rado/rado.css"></head><body><main id="app"><h1>Products</h1>
<div class="row" style="margin-bottom:14px"><input id="q" placeholder="Search Products" style="border-radius:10px 0 0 10px"><button class="btn white" id="qb" style="border:1px solid #9ca3af;border-radius:0 10px 10px 0">🔍</button></div>
<a class="btn sand" href="#" id="sc">Shop by Categories</a>
<div class="promo"><div style="font-size:54px">📲</div><h2>Buy SMS Numbers</h2><p>Buy SMS numbers for any app and any country verification on Rado Social Hub.</p><a class="btn white block" href="/sms">Buy Now 🛒</a></div>
<div id="list"></div>
<div id="dlg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;align-items:center;justify-content:center;padding:18px"><div class="card" style="max-width:520px;width:100%;margin:0;max-height:90vh;overflow:auto" id="dbox"></div></div></main><script src="/rado/rado.js"></script><script>(async()=>{const user=await initShell('Products',{title:'Products'});if(!user)return;let items=[];const qs=new URLSearchParams(location.search);let cat=qs.get('category')||'';
const stock=i=>i.stock==null?null:i.stock;const price=i=>i.price;
function render(){const q=$('#q').value.trim().toLowerCase();let v=items.filter(i=>(!cat||i.category===cat)&&(!q||(i.title+' '+(i.description||'')+' '+(i.category||'')).toLowerCase().includes(q)));
 const g={};v.forEach(i=>(g[i.category||'Other']=g[i.category||'Other']||[]).push(i));
 $('#list').innerHTML=Object.keys(g).sort().map(c=>`<div class="bar">${esc(c)}</div>`+g[c].map(i=>{const s=stock(i);return `<div class="card"><div class="item">${i.picture?`<img src="${esc(i.picture)}" alt="" loading="lazy">`:'<div class="pic">📦</div>'}<div style="flex:1"><h3>${esc(i.title)}</h3><p>In Stock: ${s==null?'Available':s+' qty'}</p><p>Per Quantity: ${naira(price(i))}</p>${(s===0)?'<span class="pill failed">Sold out</span>':`<button class="btn" data-id="${i.id}">🛒&nbsp; Buy Now</button>`}</div></div></div>`}).join('')).join('')||'<div class="card empty">No products found</div>';
 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>buy(b.dataset.id))}
function dlg(h){$('#dbox').innerHTML=h;$('#dlg').style.display='flex'}function close_(){$('#dlg').style.display='none'}W=window;
async function buy(id){const i=items.find(x=>x.id===id);
 let body=`<h2>${esc(i.title)}</h2><p style="font-size:20px">Price each: <b>${naira(i.price)}</b></p><label>Quantity</label><input id="qty" type="number" min="1" max="${i.stock==null?100:Math.min(100,i.stock)}" value="1">`;
 body+=`<p class="muted" id="tot">Total: ${naira(i.price)}</p><p class="muted">Your wallet balance: ${naira(user.balance)}</p><div id="bm" class="msg"></div><div style="display:flex;gap:10px;margin-top:14px"><button class="btn white" style="border:1px solid #9ca3af" id="cn">Cancel</button><button class="btn" id="ok" style="flex:1">Confirm purchase</button></div>`;
 dlg(body);$('#cn').onclick=close_;
 $('#qty').oninput=()=>{const q=Math.max(1,parseInt($('#qty').value)||1);$('#tot').textContent='Total: '+naira(i.price*q)};
 $('#ok').onclick=async()=>{$('#ok').disabled=true;try{const d=await api('/api/rado/products/buy','POST',{id:i.id,amount:Math.max(1,parseInt($('#qty').value)||1)});user.balance=d.newBalance;
  let out=`<h2>✅ ${esc(d.logTitle||i.title)}</h2><p class="muted">Purchase successful. New balance: ${naira(d.newBalance)}</p>`;
  if(d.logDetails)out+=`<label>Details</label><textarea readonly rows="6">${esc(d.logDetails)}</textarea>`;
  out+=`<p class="muted">You can open this again any time from Orders.</p><button class="btn block" id="dn">Done</button>`;dlg(out);$('#dn').onclick=()=>{close_();load()}}
  catch(e){$('#bm').textContent=e.message;$('#bm').className='msg err';$('#ok').disabled=false}}}
async function load(){items=await api('/api/rado/products');render()}
$('#q').oninput=render;$('#qb').onclick=render;$('#sc').onclick=e=>{e.preventDefault();$('#drawer').classList.add('open');const b=document.querySelector('[data-tg=cats]');if(b&&!b.classList.contains('open'))b.click()};
$('#dlg').onclick=e=>{if(e.target.id==='dlg')close_()};
await load();})();</script></body></html>
