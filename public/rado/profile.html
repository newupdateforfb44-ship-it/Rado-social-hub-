<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — Rado Social Hub</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/rado/rado.css"></head><body><main id="app"><h1>Profile</h1><div class="card"><h2>Profile Information</h2><p class="muted" style="font-size:19px">Update your account's profile information and email address.</p><div id="m1" class="msg"></div>
<label>Name</label><input id="n"><label>Email</label><input id="e" readonly><label>WhatsApp Number</label><input id="p" type="tel"><br><br><button class="btn" id="s1">Save</button></div>
<div class="card"><h2>Update Password</h2><p class="muted" style="font-size:19px">Ensure your account is using a long, random password to stay secure.</p><div id="m2" class="msg"></div>
<label>Current Password</label><input id="c" type="password"><label>New Password</label><input id="n1" type="password"><label>Confirm Password</label><input id="n2" type="password"><br><br><button class="btn" id="s2">Save</button></div></main><script src="/rado/rado.js"></script><script>(async()=>{const user=await initShell('Profile',{title:'Profile'});if(!user)return;$('#n').value=user.name||'';$('#e').value=user.email||'';$('#p').value=user.contactPhone||'';
const say=(id,t,ok)=>{const m=$(id);m.textContent=t;m.className='msg '+(ok?'ok':'err')};
$('#s1').onclick=async()=>{try{await api('/api/user/profile','PUT',{name:$('#n').value});if($('#p').value&&$('#p').value!==user.contactPhone)await api('/api/user/phone','PUT',{phone:$('#p').value,country:user.country});say('#m1','Saved.',1)}catch(e){say('#m1',e.message)}};
$('#s2').onclick=async()=>{if($('#n1').value!==$('#n2').value)return say('#m2','Passwords do not match.');
 try{await api('/api/auth/reset-password','POST',{oldPassword:$('#c').value,newPassword:$('#n1').value});say('#m2','Password updated.',1);$('#c').value=$('#n1').value=$('#n2').value=''}catch(e){say('#m2',e.message)}};})();</script></body></html>
