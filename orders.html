<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders — Rado Social Hub</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/rado/rado.css"></head><body><main id="app"><h1>Orders</h1><div class="card"><h2>Order History</h2><div class="scroll"><table><thead><tr><th>Order</th><th>Date</th><th>Status</th><th>Total</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script src="/rado/rado.js"></script><script>(async()=>{const user=await initShell('Orders',{title:'Orders'});if(!user)return;const rows=await loadOrders();window.__rows=rows;
$('#rows').innerHTML=rows.map(r=>orderRow(r,true)).join('')||'<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">No orders yet</td></tr>';
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const r=rows[b.dataset.v];alert((r.title||'')+'\n\n'+(r.details||'No details'))});})();</script></body></html>
