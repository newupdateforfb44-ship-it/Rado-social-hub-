<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API — Rado Social Hub</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/rado/rado.css"></head><body><main id="app"><h1>API</h1><div class="card"><h2>API Access</h2><p class="muted" style="font-size:19px">Use your API key to buy and check orders from your own software. Keep the secret private.</p><div id="m" class="msg"></div><div id="box"></div></div></main><script src="/rado/rado.js"></script><script>(async()=>{const user=await initShell('API',{title:'API'});if(!user)return;async function draw(){const k=await api('/api/user/api-key');$('#box').innerHTML=k.apiKey?`<label>API Key</label><div class="copy"><input readonly value="${esc(k.apiKey)}"><button class="btn" onclick="navigator.clipboard.writeText('${esc(k.apiKey)}')">Copy</button></div><br><button class="btn" id="g">Regenerate</button> <button class="btn white" style="border:1px solid #9ca3af" id="r">Revoke</button>`:`<button class="btn" id="g">Generate API Key</button>`;
 $('#g').onclick=async()=>{if(k.apiKey&&!await askConfirm('Your current key will stop working as soon as the new one is created.',{title:'Replace API key?',okText:'Replace key',danger:true}))return;const d=await api('/api/user/api-key/generate','POST');$('#m').className='msg ok';$('#m').innerHTML='Save your secret now, it will not be shown again:<br><b style="word-break:break-all">'+esc(d.apiSecret)+'</b>';draw2(d.apiKey)};
 const r=$('#r');if(r)r.onclick=async()=>{if(await askConfirm('Anything using this key will stop working immediately.',{title:'Revoke API key?',okText:'Revoke',danger:true})){await api('/api/user/api-key/revoke','POST');draw()}}}
function draw2(key){$('#box').innerHTML=`<label>API Key</label><div class="copy"><input readonly value="${esc(key)}"><button class="btn" onclick="navigator.clipboard.writeText('${esc(key)}')">Copy</button></div>`}
await draw();})();</script></body></html>
