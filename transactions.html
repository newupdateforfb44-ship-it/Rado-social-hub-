<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions — Rado Social Hub</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/rado/rado.css"></head><body><main id="app"><h1>Transactions</h1><div class="card"><div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Amount</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script src="/rado/rado.js"></script><script>(async()=>{const user=await initShell('Transactions',{title:'Transactions'});if(!user)return;const t=await api('/api/user/transactions');$('#rows').innerHTML=t.map(x=>`<tr><td>${new Date(x.createdAt).toLocaleDateString()}</td><td>${esc(x.type)}</td><td>${esc(x.description||'')}</td><td>${naira(x.amount)}</td><td><span class="pill ${esc(x.status)}">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">No transactions yet</td></tr>'
})();</script></body></html>
